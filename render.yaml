services:
  - type: web
    name: pdf-knowledge-assistant
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: UPLOAD_DIR
        value: storage/uploads
      - key: INDEX_DIR
        value: storage/index
      - key: DATABASE_URL
        value: sqlite:////app/storage/app.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 60
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: EMBEDDING_DIMENSION
        value: 768
      - key: EMBEDDING_BATCH_SIZE
        value: 16
      - key: CHUNK_SIZE
        value: 900
      - key: CHUNK_OVERLAP
        value: 150
      - key: TOP_K
        value: 8
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
